services:
  app:
    build: .
    container_name: wulab_app
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - db_data:/app/data
      - uploads:/app/public/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/products || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.25-alpine
    container_name: wulab_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  db_data:
  uploads:
  certbot_www:
  certbot_certs:
