services:
  app:
    build: .
    container_name: wulab_app
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:3001:3000"   # host nginx proxies from outside
    volumes:
      - db_data:/app/data
      - uploads:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/products || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  db_data:
  uploads:
